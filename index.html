<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrategias Conectux</title>
  <link rel="icon" type="image/png" href="Imagenes/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --noir: #111111;
      --purple: #a100ff;
      --purple2: #c040ff;
      --white: #ffffff;
      --mid: #1c1c1c;
      --mid2: #252525;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--noir);
      color: var(--white);
      font-family: "Satoshi", sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: "Satoshi", sans-serif; font-weight: 700; letter-spacing: -0.03em; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 32px; }

    /* HEADER */
    header { padding: 40px 0 0; }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 32px; border-bottom: 1px solid #2a2a2a;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; }
    .logo-name { font-size: 26px; font-weight: 700; letter-spacing: -0.05em; color: var(--white); text-transform: lowercase; }
    .logo-name span { color: var(--purple); }
    .tag-doc {
      font-size: 11px; font-weight: 500; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--purple);
      border: 1px solid var(--purple); padding: 5px 12px; border-radius: 20px;
    }

    /* HERO */
    .hero { padding: 32px 0 32px; position: relative; overflow: hidden; text-align: center; }
    .hero::before {
      content: ""; position: absolute; top: -60px; right: -120px;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(161,0,255,0.15) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-label {
      display: inline-block; font-size: 11px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--purple); margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(32px, 5vw, 54px); line-height: 1.05;
      letter-spacing: -0.04em; margin-bottom: 16px;
    }
    .hero h1 em { font-style: normal; color: var(--purple); }
    .hero-sub { font-size: 15px; color: #999; line-height: 1.75; margin: 0 auto 28px; }

    /* SEARCH */
    .search-wrapper { position: relative; max-width: 520px; margin: 0 auto; }
    .search-wrapper svg {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%); color: #555; pointer-events: none;
    }
    #search {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background: var(--mid);
      color: var(--white);
      font-family: "Satoshi", sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search::placeholder { color: #444; }
    #search:focus { border-color: rgba(161,0,255,0.5); }

    /* RESULTS */
    .results-section { padding: 20px 0 80px; }
    .results-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--purple); margin-bottom: 20px;
      text-align: center;
    }
    #results { display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin: 0 auto; }

    .result-card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--mid);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 22px 28px;
      text-decoration: none;
      color: var(--white);
      position: relative; overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
    }
    .result-card::after {
      content: ""; position: absolute; bottom: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(161,0,255,0.1) 0%, transparent 65%);
      pointer-events: none;
    }
    .result-card:hover { border-color: rgba(161,0,255,0.5); transform: translateY(-2px); }
    .result-card-left { display: flex; flex-direction: column; gap: 4px; }
    .result-card-badge {
      display: inline-block;
      background: rgba(161,0,255,0.12); color: var(--purple);
      border: 1px solid rgba(161,0,255,0.28);
      font-size: 10px; font-weight: 600; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
      width: fit-content; margin-bottom: 6px;
    }
    .result-card-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .result-card-arrow {
      font-size: 20px; color: var(--purple); flex-shrink: 0;
      transition: transform 0.15s;
    }
    .result-card:hover .result-card-arrow { transform: translateX(4px); }

    .empty {
      font-size: 14px; color: #555;
      padding: 24px 0;
    }

    /* FOOTER */
    footer { padding: 48px 0 32px; border-top: 1px solid #1e1e1e; }
    .footer-inner { display: flex; flex-direction: column; gap: 20px; }
    .footer-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .footer-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.04em; text-transform: lowercase; color: var(--white); }
    .footer-logo em { font-style: normal; color: var(--purple); }
    .footer-contact a { color: var(--purple); text-decoration: none; font-size: 14px; font-weight: 500; }
    .footer-bottom {
      font-size: 12px; color: #444; padding-top: 20px;
      border-top: 1px solid #1e1e1e;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .hero > * { animation: fadeUp 0.6s ease both; }
    .hero > *:nth-child(2) { animation-delay: 0.1s; }
    .hero > *:nth-child(3) { animation-delay: 0.2s; }
    .hero > *:nth-child(4) { animation-delay: 0.3s; }

    @media (max-width: 640px) {
      .container { padding: 0 20px; }
      .header-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
      .footer-top { flex-direction: column; align-items: flex-start; }
      .footer-bottom { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container">
      <div class="header-inner">
        <div class="logo">
          <img src="Imagenes/logo.png" alt="Conectux" style="height:38px; width:auto;" />
        </div>
        <span class="tag-doc">Portal de Estrategias</span>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <h1>Estrategias <em>Conectux</em></h1>
      <p class="hero-sub">Busca la tuya:</p>
      <div class="search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="search" placeholder="Escribe tu nombre o el de tu negocio..." autocomplete="off" />
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="results-section">
    <div class="container">
      <p class="results-label" id="results-label">Estrategias disponibles</p>
      <div id="results"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div class="footer-inner">
        <div class="footer-top">
          <div>
            <img src="Imagenes/logo.png" alt="Conectux" style="height:28px; width:auto;" />
            <p style="font-size:12px;color:#555;margin-top:4px">Agencia de Marketing Digital</p>
          </div>
          <div class="footer-contact">
            <p style="font-size:13px;color:#777;margin-bottom:6px">¿Hablamos de tu estrategia?</p>
            <a href="https://wa.me/573005473048">Escríbenos por WhatsApp →</a>
          </div>
        </div>
        <div class="footer-bottom">
          <span>© 2025 Conectux Digital. Todos los derechos reservados.</span>
          <span>Estrategias personalizadas para cada cliente</span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const pages = [
      { name: "Dr. Wilmar Oftalmólogo", file: "dr-wilmar/" },
      { name: "Las Huertas Agencia", file: "las-huertas/" },
      { name: "Gerpar", file: "gerpar/" },
    ];

    const searchInput = document.getElementById('search');
    const resultsEl = document.getElementById('results');
    const resultsLabel = document.getElementById('results-label');

    function render(list, query) {
      resultsEl.innerHTML = '';
      if (query && list.length === 0) {
        resultsLabel.textContent = 'Sin resultados';
        resultsEl.innerHTML = '<p class="empty">No encontramos ninguna estrategia con ese nombre.</p>';
        return;
      }
      resultsLabel.textContent = query
        ? `${list.length} resultado${list.length !== 1 ? 's' : ''} encontrado${list.length !== 1 ? 's' : ''}`
        : 'Estrategias disponibles';

      list.forEach(({ name, file }) => {
        const a = document.createElement('a');
        a.className = 'result-card';
        a.href = file;
        a.innerHTML = `
          <span class="result-card-name">${name}</span>
          <span class="result-card-arrow">→</span>
        `;
        resultsEl.appendChild(a);
      });
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q ? pages.filter(p => p.name.toLowerCase().includes(q)) : pages;
      render(filtered, q);
    });

    render(pages, '');
  </script>

</body>
</html>
